<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Noesis</title>
  <desc id="desc">Noesis wordmark and an open book drawn in violet and teal on a midnight grid.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#10182c"/>
      <stop offset="1" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#a999ff"/>
      <stop offset="1" stop-color="#69f2d0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#6659c1" stop-opacity=".44"/>
      <stop offset="1" stop-color="#6659c1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#9ca9d6" stroke-opacity=".10"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <ellipse cx="932" cy="174" rx="365" ry="242" fill="url(#halo)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#7b87ae" stroke-opacity=".42"/>
  <path d="M86 86h54" stroke="#8bded7" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="203" fill="#f4f5ff" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="-6">Noesis</text>
  <text x="87" y="254" fill="#bcc6e5" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4">READING &amp; MEMORY</text>
  <g transform="translate(914 180)">
    <ellipse rx="209" ry="101" transform="rotate(-16)" fill="none" stroke="#a999ff" stroke-opacity=".39"/>
    <ellipse rx="202" ry="100" transform="rotate(20)" fill="none" stroke="#69f2d0" stroke-opacity=".33"/>
    <circle r="109" fill="#121b31" fill-opacity=".85" stroke="#8c99c1" stroke-opacity=".27"/>
    <path d="M0-48C-25-68-57-68-82-58v112c30-13 58-10 82 8 24-18 52-21 82-8V-58C57-68 25-68 0-48Zm0 0V60" fill="#172039" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-63-33c15-4 32-2 45 5m-45 15c15-4 32-2 45 5m-45 15c15-4 32-2 45 5m36-40c13-7 30-9 45-5M18-8c13-7 30-9 45-5M18 12c13-7 30-9 45-5" fill="none" stroke="#aebbe0" stroke-opacity=".78" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-183" cy="72" r="5" fill="#a999ff"/>
    <circle cx="166" cy="89" r="5" fill="#69f2d0"/>
    <path d="M146-113v22m-11-11h22" stroke="#c4beff" stroke-width="2" stroke-linecap="round"/>
